<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="design, branding, editorial, reportes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/styles.css">

    <title>The Critters Group</title>
    <script src="./js/carrito.js" defer></script>
    <script>
        // Inicializar contador del carrito cuando se carga la página
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                if (typeof carrito !== 'undefined') {
                    carrito.actualizarContador();
                }
            }, 100);
        });
    </script>
</head>

<body class="carrito-page">
<header class="header">
    <nav class="menu-container"> 
    <img class="logo" src="./images/logo.png" alt="Logo Critters">

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
<label for="menu-toggle" class="hamburger">&#9776;</label>
     <ul class="menu">
         <li class="menu__item active"> <a href="./index.html">Inicio</a></li>
         <li class="menu__item"> <a href="#nosotros">Nosotros</a></li>
         <li class="menu__item"> <a href="#servicios">Servicios</a></li>
         <li class="menu__item"> <a href="./proyectos.html">Proyectos</a></li>
         <li class="menu__item"> <a href="#formulario">Contacto</a></li>
                 <li class="cta-button"> 
           <a href="carrito.html"> 
             <i class="fa-solid fa-cart-shopping"></i> Carrito 
             <span class="cart-count" id="cart-count">0</span>
           </a>
         </li>
    </ul>
</nav>
</header>

<div class="wrapper">

  <aside>
    <div><h2 class="logo-carrito">SHOPPER</h2></div>
    <nav aria-label="Opciones del carrito">
      <ul class="shop-menu">
        <li>
          <a class="shop-boton-menu boton-carrito active" href="./carrito.html">
            <i class="bi bi-cart-fill"></i> Carrito
          </a>
        </li>
        <li>
          <a class="shop-boton-menu boton-volver" href="./index.html">
            <i class="bi bi-arrow-return-left"></i> Seguir comprando
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main-carrito">
    <h2 class="tituloppal">Carrito</h2>
    <div class="contenedor-carrito">

      <p class="carrito-vacio">Tu carrito está vacío <i class="bi bi-emoji-frown-fill"></i></p>

      <div class="carrito-productos">
        <!-- Los productos se cargarán dinámicamente aquí -->
      </div> <!-- .carrito-productos -->

      <div class="carrito-acciones">
        <div class="carrito-acciones-izquierda">
          <button class="carrito-acciones-vaciar">Vaciar carrito</button>
        </div>
        <div class="carrito-acciones-derecha">
          <div class="carrito-acciones-total">
            <p>Total:</p>
            <p id="total">$0</p>
          </div>
          <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
        </div>
        <p id="carrito-comprado" class="carrito-comprado disabled">
          Muchas gracias por tu compra <i class="bi bi-emoji-smile-fill"></i>
        </p>
      </div> <!-- .carrito-acciones -->

    </div> <!-- .contenedor-carrito -->
  </main>

</div> <!-- .wrapper -->


<footer class="footer" id="formulario">
  <div class="footer-info">
    <div class="logotxt">Critters <span>group</span></div>
    <p>thecrittersgroup@gmail.com</p>
    <div class="icons">
<i class="fab fa-behance"></i>
<i class="fab fa-linkedin"></i>
<i class="fab fa-whatsapp"></i>
    </div>
  </div>

  <div class="footer-form">
    <h2>Contacto</h2>
    <form action="https://formspree.io/f/xdkgllga" method="POST">
      <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
      </p>
      <p>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
      </p>
      <p>
        <button type="submit" class="cta-buttonbuy">Enviar</button>
      </p>
    </form>
  </div>
</footer>

</body>
</html>
