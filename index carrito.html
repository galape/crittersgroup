<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="design, branding, editorial, reportes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/styles.css">
   
    <title>The Critters Group</title>
</head>

<body>
<header class="header">
    <nav class="menu-container"> 
    <img class="logo" src="./images/logo.png" alt="Logo Critters">

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
<label for="menu-toggle" class="hamburger">&#9776;</label>
     <ul class="menu">
         <li class="menu__item active"> <a href="./index.html">Inicio</a></li>
         <li class="menu__item"> <a href="#nosotros">Nosotros</a></li>
         <li class="menu__item"> <a href="#servicios">Servicios</a></li>
         <li class="menu__item"> <a href="./proyectos.html">Proyectos</a></li>
         <li class="menu__item"> <a href="#formulario">Contacto</a></li>
        <li class="cta-button"> <a href="carrito.html"> <i class="fa-solid fa-cart-shopping"></i> Carrito </a></li>
    </ul>
</nav>
</header>

<div class="wrapper">

  <aside>
    <div><h2 class="logo-carrito">SHOPPER</h2></div>
    <nav aria-label="Categorías de productos">
      <ul class="shop-menu">
        <li><button class="shop-boton-menu boton-categoria active"><i class="bi bi-archive-fill"></i>Todos los productos</button></li>
        <li><button class="shop-boton-menu boton-categoria"><i class="bi bi-image-fill"></i>Branding</button></li>
        <li><button class="shop-boton-menu boton-categoria"><i class="bi bi-window-stack"></i>Presentaciones</button></li>
        <li><button class="shop-boton-menu boton-categoria"><i class="bi bi-book-fill"></i>Diseño editorial</button></li>
        <li><button class="shop-boton-menu boton-categoria"><i class="bi bi-box-fill"></i>Packaging</button></li>
        <li>
          <a class="shop-boton-menu boton-carrito" href="../carrito.html">
            <i class="bi bi-cart-fill"></i>Carrito <span class="numerito active">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main-carrito">
    <h2 class="tituloppal">Todos los productos</h2>
    <div class="contenedor-productos">

      <div class="producto">
        <img class="producto-imagen" src="../images/1x/branding-8.png" alt="Branding">
        <div class="producto-detalles">
          <h3 class="producto-titulo">Branding 01</h3>
          <p class="producto-precio">$1500</p>
          <button class="producto-agregar">Agregar</button>
        </div>
      </div>

      <div class="producto">
        <img class="producto-imagen" src="../images/1x/branding-8.png" alt="Branding">
        <div class="producto-detalles">
          <h3 class="producto-titulo">Branding 02</h3>
          <p class="producto-precio">$1500</p>
          <button class="producto-agregar">Agregar</button>
        </div>
      </div>

      <div class="producto">
        <img class="producto-imagen" src="../images/1x/branding-8.png" alt="Branding">
        <div class="producto-detalles">
          <h3 class="producto-titulo">Branding 03</h3>
          <p class="producto-precio">$1500</p>
          <button class="producto-agregar">Agregar</button>
        </div>
      </div>

      <div class="producto">
        <img class="producto-imagen" src="../images/1x/branding-8.png" alt="Branding">
        <div class="producto-detalles">
          <h3 class="producto-titulo">Branding 04</h3>
          <p class="producto-precio">$1500</p>
          <button class="producto-agregar">Agregar</button>
        </div>
      </div>

    </div> <!-- cierre de .contenedor-productos -->
  </main>

</div> <!-- cierre de .wrapper -->


<footer class="footer" id="formulario">
  <div class="footer-info">
    <div class="logotxt">Critters <span>group</span></div>
    <p>thecrittersgroup@gmail.com</p>
    <div class="icons">
<i class="fab fa-behance"></i>
<i class="fab fa-linkedin"></i>
<i class="fab fa-whatsapp"></i>
    </div>
  </div>

  <div class="footer-form">
    <h2>Contacto</h2>
    <form action="https://formspree.io/f/xdkgllga" method="POST">
      <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
      </p>
      <p>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
      </p>
      <p>
        <button type="submit" class="cta-buttonbuy">Enviar</button>
      </p>
    </form>
  </div>
</footer>

</body>
</html>
